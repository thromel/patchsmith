[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "patchsmith-research"
version = "0.1.0"
description = "AI software-maintenance agent research platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0.7"]

[project.optional-dependencies]
deepagents = ["deepagents>=0.6.8", "langchain-openai>=1.3.0"]
openai-agents = ["openai-agents"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
patchsmith = "patchsmith.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/fixtures"]
markers = [
  "unit: fast tests with no subprocess, Docker, or network usage",
  "integration: tests that run subprocesses, sandboxes, or full CLI flows",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Line length is handled by the formatter; long report strings are common.
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["patchsmith"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["patchsmith"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "patchsmith.models",
  "patchsmith.evaluation_models",
  "patchsmith.runtime_core",
]
check_untyped_defs = true
disallow_untyped_defs = true

# Legacy mega-modules pending decomposition; tighten these as they are split
# into subpackages (see codebase reorganization plan).
[[tool.mypy.overrides]]
module = [
  "patchsmith.cli",
  "patchsmith.evaluation",
  "patchsmith.evaluation.*",
  "patchsmith.observability",
  "patchsmith.planning",
]
disable_error_code = [
  "attr-defined",
  "assignment",
  "union-attr",
  "arg-type",
  "misc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patchsmith"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/adr",
  "/docs",
  "/evals",
  "/experiments",
  "/manifest.json",
  "/pyproject.toml",
  "/src",
  "/templates",
  "/tests",
]
