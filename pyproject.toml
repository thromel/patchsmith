[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "patchsmith-research"
version = "0.1.0"
description = "AI software-maintenance agent research platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0.7"]

[project.optional-dependencies]
deepagents = ["deepagents>=0.6.3"]

[project.scripts]
patchsmith = "patchsmith.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"
