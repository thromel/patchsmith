[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "patchsmith-research"
version = "0.1.0"
description = "AI software-maintenance agent research platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
deepagents = ["deepagents>=0.6.8", "langchain-openai>=1.3.0"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
patchsmith = "patchsmith.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/fixtures"]
markers = [
  "unit: fast tests with no subprocess, Docker, or network usage",
  "integration: tests that run subprocesses, sandboxes, or full CLI flows",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "RSE", "ISC", "PTH"]
ignore = [
  # Line length is handled by the formatter; long report strings are common.
  "E501",
  # Conflicts with the formatter.
  "ISC001",
]

[tool.ruff.lint.isort]
known-first-party = ["patchsmith"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["patchsmith"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "patchsmith.models",
  "patchsmith.evaluation_models",
  "patchsmith.evaluation.complex.*",
  "patchsmith.runtime.core",
  "patchsmith.session.*",
]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/patchsmith"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/adr",
  "/docs",
  "/evals",
  "/experiments",
  "/manifest.json",
  "/pyproject.toml",
  "/src",
  "/templates",
  "/tests",
]
